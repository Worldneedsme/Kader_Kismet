<style>
/* Layout: tek dikey oyun sütunu; üstte HUD, ortada izometrik dünya, altta sohbet ve aksiyonlar */
:root {
  --gece: #1B2A41;
  --gece-derin: #111C2E;
  --panel: #22344F;
  --panel-acik: #2F4769;
  --turunc: #F28C28;
  --kum: #F3E9DC;
  --deniz: #2BB3A3;
  --mercan: #E4572E;
  --pembe: #FF6B8B;
  --gri: #9AA7BC;
  --f-baslik: "Fraunces", Georgia, "Times New Roman", serif;
  --f-arayuz: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--gece-derin);
  color: var(--kum);
  font-family: var(--f-arayuz);

}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { display: flex; align-items: center; gap: 10px; }
.me { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
.portrait {

}
.me-info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.me-name { font-weight: 800; font-size: 14px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-sub { font-size: 12px; color: var(--gri); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-sub b { color: var(--pembe); font-weight: 800; }
.gala-btn {

  background: var(--panel); border: 1px solid var(--panel-acik);

}
.gala-title { font-family: var(--f-baslik); font-size: 17px; line-height: 1; text-align: left; }
.gala-progress { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gri); font-variant-numeric: tabular-nums; }
.gala-bar { flex: 1; height: 5px; border-radius: 3px; background: var(--panel-acik); overflow: hidden; }
.gala-bar i { display: block; height: 100%; width: 0; background: var(--deniz); transition: width .3s ease; }
.gala-btn.ready { background: var(--turunc); border-color: var(--turunc); color: var(--gece); cursor: pointer; animation: glow 1.6s ease-in-out infinite; }
.gala-btn.ready .gala-progress { color: var(--gece); }
.gala-btn.ready .gala-bar { background: rgba(27, 42, 65, .25); }
.gala-btn.ready .gala-bar i { background: var(--gece); }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(242, 140, 40, .3); } }

.stage {
  position: relative; flex: 1; min-height: 0;
  border-radius: 18px; overflow: hidden;
  background: var(--gece);
  box-shadow: 0 0 0 1px var(--panel-acik);
}
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.chip {
  position: absolute; top: 10px; left: 10px;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800;
  background: rgba(17, 28, 46, .82); color: var(--kum); border: 1px solid var(--panel-acik);
  pointer-events: none;
}
.chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--deniz); }
.toasts {
  position: absolute; left: 12px; right: 12px; top: 48px;

  pointer-events: none;
}
.toast {
  max-width: 100%; box-sizing: border-box;

  border-radius: 12px; padding: 8px 12px;
  font-size: 13px; font-weight: 700; text-align: center;
  animation: toast-in .25s ease;
}
.toast.good { border-color: var(--deniz); }
.toast.bad { border-color: var(--mercan); }
.toast.love { border-color: var(--pembe); }

.fade { position: absolute; inset: 0; background: var(--gece-derin); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.fade.on { opacity: 1; }

.dialog {

.dlg-who { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
.dlg-name { font-weight: 800; font-size: 15px; }

.dlg-chem .bar { width: 80px; height: 5px; border-radius: 3px; background: var(--panel-acik); overflow: hidden; }
.dlg-chem .bar i { display: block; height: 100%; background: var(--pembe); transition: width .3s ease; }
.dlg-leave { border: 0; background: none; color: var(--gri); font: 700 12px var(--f-arayuz); cursor: pointer; padding: 6px; }
.dlg-react { margin: 0; font-size: 13px; font-style: italic; color: var(--gri); }
.dlg-text { margin: 0; font-size: 15px; line-height: 1.45; font-weight: 600; }
.dlg-choices { display: flex; flex-direction: column; gap: 8px; }
.choice {

  background: var(--panel); border: 1px solid var(--panel-acik);
  color: var(--kum); font: 700 14px var(--f-arayuz); cursor: pointer;

.choice:hover { border-color: var(--turunc); }
.choice.main { background: var(--turunc); border-color: var(--turunc); color: var(--gece); }

.chat { display: flex; gap: 8px; }
.chat input {
  flex: 1; min-width: 0;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 10px 12px;
  color: var(--kum); font: 600 14px var(--f-arayuz);
}
.chat input::placeholder { color: var(--gri); }
.send {
  flex: none; border: 0; border-radius: 12px; padding: 0 14px;
  background: var(--turunc); color: var(--gece);
  font: 800 13px var(--f-arayuz); cursor: pointer;
}
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 7px 4px;
  color: var(--kum); font: 700 11px var(--f-arayuz);
  cursor: pointer;
}
.act svg { width: 20px; height: 20px; }
.act:active, .send:active, .choice:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--turunc); outline-offset: 2px; }

.modal-back {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(8, 13, 24, .74);
  display: grid; place-items: center;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal {
  width: 100%; max-width: 400px; max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 18px; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.modal h2 { margin: 0; font-family: var(--f-baslik); font-weight: 700; font-size: 24px; line-height: 1.15; text-wrap: balance; }
.modal p { margin: 0; color: var(--gri); font-size: 14px; line-height: 1.5; }
.modal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; }
.eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--turunc); font-weight: 800; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 14px;
  background: var(--turunc); color: var(--gece);
  font: 800 14px var(--f-arayuz); cursor: pointer;
}
.btn.ghost { background: var(--gece); color: var(--kum); border: 1px solid var(--panel-acik); }
.btn:disabled { opacity: .5; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--gri); }
.field input {
  background: var(--gece); border: 1px solid var(--panel-acik); border-radius: 12px;
  padding: 11px 12px; color: var(--kum); font: 700 15px var(--f-arayuz);
}
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.seg button[aria-pressed="true"] { background: var(--turunc); border-color: var(--turunc); color: var(--gece); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 12px;
  background: var(--gece); border: 1px solid var(--panel-acik);
  font-size: 14px; font-weight: 700;
}
.row .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; border: 1.5px solid var(--kum); }
.row .grow { flex: 1; min-width: 0; }
.row small { display: block; font-size: 11px; color: var(--gri); font-weight: 700; margin-top: 2px; }
.row .tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--panel); color: var(--gri); white-space: nowrap; }
.row .tag.ok { background: rgba(43, 179, 163, .18); color: var(--deniz); }
.row .tag.love { background: rgba(255, 107, 139, .18); color: var(--pembe); }
.row.pick { cursor: pointer; color: var(--kum); font-family: inherit; text-align: left; }
.row.pick:hover { border-color: var(--mercan); }
.row.out { border-color: var(--mercan); background: rgba(228, 87, 46, .12); }
.couple { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 14px; background: var(--gece); border: 1px solid var(--pembe); font-weight: 800; }
.couple svg { width: 18px; height: 18px; color: var(--pembe); }
.group-title { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--gri); font-weight: 800; margin-top: 4px; }
.num { font-variant-numeric: tabular-nums; }
.tally { display: grid; grid-template-columns: 1fr auto auto auto; gap: 6px 12px; font-size: 13px; align-items: center; }
.tally .h { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gri); font-weight: 800; }
.tally .out { color: var(--mercan); font-weight: 800; }
@media (prefers-reduced-motion: reduce) {
  .toast, .dialog, .gala-btn.ready { animation: none; }
  .fade, .gala-bar i, .dlg-chem .bar i { transition: none; }
}
</style>

/* ---------- Yol bulma (Dijkstra, 8 yön, köşe kesmeden) ---------- */
function findPath(r, sx, sy, isGoal) {
  const W = r.w, H = r.h, N = W * H;
  const walk = (x, y) => WALK.has(tileAt(r, x, y));
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), done = new Uint8Array(N);
  const s = sy * W + sx;
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return null;
  dist[s] = 0;
  for (;;) {
    let u = -1, best = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) return null;
    done[u] = 1;
    const ux = u % W, uy = (u / W) | 0;
    if (isGoal(ux, uy)) {
      const out = [];
      for (let v = u; v !== s; v = prev[v]) out.push([v % W, (v / W) | 0]);
      return out.reverse();
    }
    if (u !== s && !walk(ux, uy)) continue;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = ux + dx, ny = uy + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (!walk(nx, ny) && !isGoal(nx, ny)) continue;
      if (dx && dy && (!walk(ux + dx, uy) || !walk(ux, uy + dy))) continue;
      const v = ny * W + nx, nd = dist[u] + (dx && dy ? 1.414 : 1);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; }
    }
  }
}

/* ---------- Dokunma / sürükleme ---------- */
let down = null;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  down = { x: e.clientX, y: e.clientY, cx: state.cam.x, cy: state.cam.y, drag: false };
});
canvas.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  if (down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.drag && Math.hypot(dx, dy) > 8) down.drag = true;
    if (down.drag) { state.cam.follow = false; state.cam.x = down.cx - dx / z; state.cam.y = down.cy - dy / z; clampCamera(); }
  } else if (e.pointerType === "mouse") {
    const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const tx = Math.round(w.wx), ty = Math.round(w.wy);
    state.hover = tileAt(room(), tx, ty) ? { x: tx, y: ty } : null;
  }
});
canvas.addEventListener("pointerup", e => {

  const wasDrag = down.drag; down = null;
  if (wasDrag) return;

});

function charHit(bx, by) {
  const list = npcs.filter(n => n.room === state.room).sort((a, b) => (b.x + b.y) - (a.x + a.y));
  for (const n of list) {
    const p = iso(n.x, n.y), top = n.sit ? 52 : 66;
    if (bx > p.x - 13 && bx < p.x + 13 && by > p.y - top && by < p.y + 5) return n;
  }
  return null;
}
function handleTap(px, py) {
  if (dlg || state.phase !== "day") return;
  const r = room();
  const w = screenToWorld(px, py);
  const n = charHit(w.bx, w.by);
  if (n) {
    if (n.mode === "chat" || n.mode === "meet") {
      const other = n.task ? n.task.partner : (n.chat ? n.chat.partner : null);
      toast(n.def.name + " şu an" + (other ? " " + other.def.name + " ile" : "") + " konuşuyor.");
      return;
    }
    n.hold = NOW + 9000;
    if (n.path.length) n.path = n.path.slice(0, 1);
    n.after = null;
    const [tx, ty] = n.path.length ? n.path[0] : [Math.round(n.x), Math.round(n.y)];
    if (Math.max(Math.abs(Math.round(player.x) - tx), Math.abs(Math.round(player.y) - ty)) === 1 && !player.path.length) {
      player.action = { type: "talk", npc: n }; playerArrive(); return;
    }
    goTo(nearGoal(r, tx, ty), { type: "talk", npc: n });
    return;
  }
  const tx = Math.round(w.wx), ty = Math.round(w.wy);
  const k = tileAt(r, tx, ty);
  if (!k) return;
  if (WALK.has(k)) {
    const door = k === "D" ? r.doors[tx + "," + ty] : null;
    goTo((x, y) => x === tx && y === ty, door ? { type: "door", door } : null);
  } else if (SIT.has(k) && !seatTaken(r.id, tx, ty, player)) {
    goTo((x, y) => x === tx && y === ty, { type: "sit", x: tx, y: ty });
  } else {
    goTo(nearGoal(r, tx, ty), null);
  }
}

/* ---------- Yarışmacıların kendi arasındaki konuşmaları ---------- */
function doorTo(from, to) {
  const r = ROOMS[from];
  for (const k in r.doors) if (r.doors[k].to === to) { const [x, y] = k.split(",").map(Number); return { x, y, door: r.doors[k] }; }
  return null;
}
function scheduleTalks() {
  if (state.phase !== "day" || NOW < state.nextSchedule) return;
  state.nextSchedule = NOW + 1200;
  const active = npcs.filter(n => n.mode === "meet").length;
  if (active >= 3) return;
  const free = shuffle(npcs.filter(n => n.mode === "idle" && NOW > n.hold && NOW > (n.arrivedAt || 0) + 6000));
  for (const a of free) for (const b of free) {
    if (a === b || a.def.g === b.def.g || talked(a, b)) continue;
    a.mode = "meet"; a.task = { partner: b }; a.after = null; a.sit = false;
    b.mode = "wait"; b.task = { partner: a }; b.after = null; b.path = b.path.slice(0, 1);
    return;
  }
}
function npcArrive(n) {
  if (n.after && n.after.type === "sit") {
    const { x, y } = n.after; n.after = null;
    if (!seatTaken(n.room, x, y, n)) sitDown(n, x, y);
  }
}
function updateNPC(n, dt) {
  step(n, dt);
  if (n.mode === "idle") {
    if (state.phase !== "day" || n.path.length || NOW < n.nextWander || NOW < n.hold) return;
    n.nextWander = NOW + 4500 + Math.random() * 6000;
    const r = ROOMS[n.room];
    if (Math.random() < 0.3) {
      const seats = r.objects.filter(o => SIT.has(o.k) && !seatTaken(r.id, o.x, o.y, n));
      const s = seats.length ? pick(seats) : null;
      if (s) {
        const p = findPath(r, Math.round(n.x), Math.round(n.y), (x, y) => x === s.x && y === s.y);
        if (p && p.length) { n.sit = false; n.path = p; n.after = { type: "sit", x: s.x, y: s.y }; return; }
      }
    }
    for (let tries = 0; tries < 12; tries++) {
      const x = Math.round(n.x) + Math.floor(Math.random() * 9) - 4, y = Math.round(n.y) + Math.floor(Math.random() * 9) - 4;
      if (tileAt(r, x, y) !== "." || (x === Math.round(n.x) && y === Math.round(n.y))) continue;
      const p = findPath(r, Math.round(n.x), Math.round(n.y), (a, b) => a === x && b === y);
      if (p) { n.sit = false; n.path = p; break; }
    }
    if (n.room === state.room && NOW > n.nextAmbient && dist(n, player) < 5 && !n.bubble) {
      say(n, pick(n.def.talk), 3200);
      n.nextAmbient = NOW + 15000 + Math.random() * 15000;
    }
  } else if (n.mode === "meet") {
    const p = n.task.partner;
    if (!npcs.includes(p) || state.phase !== "day") { n.mode = "idle"; n.task = null; return; }
    if (n.path.length || p.mode === "player") return;
    const r = ROOMS[n.room];
    if (n.room !== p.room) {
      const d = doorTo(n.room, p.room);
      if (Math.round(n.x) === d.x && Math.round(n.y) === d.y) { n.room = p.room; n.x = d.door.at[0]; n.y = d.door.at[1]; }
      else { const pth = findPath(r, Math.round(n.x), Math.round(n.y), (x, y) => x === d.x && y === d.y); if (pth) n.path = pth; else abortMeet(n); }
      return;
    }
    if (p.moving) return;
    if (dist(n, p) > 1.6) {
      const pth = findPath(r, Math.round(n.x), Math.round(n.y), nearGoal(r, Math.round(p.x), Math.round(p.y)));
      if (pth && pth.length) n.path = pth; else if (!pth) abortMeet(n);
      return;
    }
    n.mode = "chat"; p.mode = "chat";
    setFace(n, p.x - n.x, p.y - n.y); setFace(p, n.x - p.x, n.y - p.y);
    n.chat = { partner: p, lines: pick(SMALLTALK), i: 0, next: NOW + 300 };
    p.chat = { partner: n };
  } else if (n.mode === "chat" && n.chat && n.chat.lines) {
    const c = n.chat;
    if (NOW < c.next) return;
    if (c.i < c.lines.length) {
      say(c.i % 2 ? c.partner : n, c.lines[c.i], 2400);
      c.i++; c.next = NOW + 2600;
      return;
    }
    endNpcTalk(n, c.partner);
  }
}
function abortMeet(n) {
  const p = n.task && n.task.partner;

}
function endNpcTalk(a, b) {
  a.mode = "idle"; b.mode = "idle"; a.task = b.task = null; a.chat = b.chat = null;
  a.nextWander = b.nextWander = NOW + 2500 + Math.random() * 2000;
  state.talked.add(pairKey(a.id, b.id));
  const overlap = a.def.likes.filter(t => b.def.likes.includes(t)).length;
  const v = getChem(a, b) + Math.floor(Math.random() * 3) - 1 + (overlap ? 1 : 0);
  setChem(a, b, v);
  const nv = getChem(a, b);
  if (nv >= 7 && !state.matchOf[a.id] && !state.matchOf[b.id]) makeMatch(a, b);
  else if (nv < 4 && state.matchOf[a.id] === b.id) unmatch(a.id);
  updateHud();
}

let galaLock = false;
function startGala() {

    ${single.length ? `<p>Match'i olmayanlar: ${esc(single.join(", "))}</p>` : ""}

}
function galaVote() {

    const v = getChem(player, c), m = state.matchOf[player.id] === c.id;

function galaReveal(myPick) {
  const votes = house().map(v => {
    if (v === player) return [v, myPick];
    const opp = house().filter(c => c.def.g !== v.def.g);
    const pool = opp.filter(c => state.matchOf[v.id] !== c.id);
    let best = null, min = Infinity;
    for (const c of (pool.length ? pool : opp)) { const s = getChem(v, c) + Math.random() * 1.2; if (s < min) { min = s; best = c; } }
    return [v, best];
  });

/* ---------- Güncelleme ---------- */
function step(c, dt) {
  if (!c.path.length) { c.moving = false; return; }
  const [tx, ty] = c.path[0];
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), sp = c.speed * dt;
  setFace(c, dx, dy);
  c.moving = true; c.walkT += dt * 11;
  if (d <= sp) {
    c.x = tx; c.y = ty; c.path.shift();
    if (!c.path.length) { c.moving = false; if (c === player) playerArrive(); else npcArrive(c); }
  } else { c.x += dx / d * sp; c.y += dy / d * sp; }
}
function clampCamera() {
  const r = room();
  const minX = iso(0, r.h - 1).x - TW, maxX = iso(r.w - 1, 0).x + TW;
  const minY = iso(0, 0).y - WALL_H - 30, maxY = iso(r.w - 1, r.h - 1).y + TH + 40;
  const vw = cw / z, vh = ch / z, c = state.cam;
  c.x = (maxX - minX) <= vw ? (minX + maxX) / 2 : Math.max(minX + vw / 2, Math.min(maxX - vw / 2, c.x));
  c.y = (maxY - minY) <= vh ? (minY + maxY) / 2 : Math.max(minY + vh / 2, Math.min(maxY - vh / 2, c.y));
}
function snapCamera() { const p = iso(player.x, player.y); state.cam.x = p.x; state.cam.y = p.y - 20; clampCamera(); }
function updateCamera(dt) {
  if (!state.cam.follow) return;
  const p = iso(player.x, player.y), k = 1 - Math.pow(0.002, dt);
  state.cam.x += (p.x - state.cam.x) * k;
  state.cam.y += (p.y + (dlg ? 60 : -20) - state.cam.y) * k;
  clampCamera();
}

/* ---------- Çizim yardımcıları ---------- */
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();

}
function diamond(cx, cy, s = 1) { return [[cx, cy - TH / 2 * s], [cx + TW / 2 * s, cy], [cx, cy + TH / 2 * s], [cx - TW / 2 * s, cy]]; }

  ctx.bezierCurveTo(x + s * 0.9, y - s * 0.9, x + s * 1.3, y + s * 0.1, x, y + s * 0.9);
  ctx.fillStyle = fill; ctx.fill();
}
function isoBox(wx, wy, fx, fy, h, z0, top, left, right) {
  const P = (dx, dy, up) => { const p = iso(wx + dx, wy + dy); return [p.x, p.y - up]; };
  const A = u => P(-fx / 2, -fy / 2, u), B = u => P(fx / 2, -fy / 2, u), Cc = u => P(fx / 2, fy / 2, u), D = u => P(-fx / 2, fy / 2, u);
  poly([D(z0), Cc(z0), Cc(z0 + h), D(z0 + h)], left);
  poly([Cc(z0), B(z0), B(z0 + h), Cc(z0 + h)], right);
  poly([A(z0 + h), B(z0 + h), Cc(z0 + h), D(z0 + h)], top);
}

/* ---------- Arka plan ---------- */
function drawBackdrop(t) {
  const g = ctx.createLinearGradient(0, 0, 0, ch);
  g.addColorStop(0, "#16223A"); g.addColorStop(0.38, "#3B3458"); g.addColorStop(0.56, "#B65A3F"); g.addColorStop(0.63, "#F0913A");
  g.addColorStop(0.635, "#2C7A86"); g.addColorStop(1, "#0F3047");
  ctx.fillStyle = g; ctx.fillRect(0, 0, cw, ch);
  const hy = ch * 0.633;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cw, hy); ctx.clip();
  const sg = ctx.createRadialGradient(cw * 0.74, hy, 4, cw * 0.74, hy, 80);
  sg.addColorStop(0, "rgba(255,210,130,.9)"); sg.addColorStop(1, "rgba(255,170,90,0)");
  ctx.fillStyle = sg; ctx.fillRect(0, 0, cw, hy);
  circle(cw * 0.74, hy + 6, 22, "#FFC56B");
  ctx.fillStyle = "#2A2440";
  const kx = cw * 0.1;
  ctx.beginPath(); ctx.moveTo(kx - 30, hy); ctx.lineTo(kx - 18, hy - 22); ctx.lineTo(kx + 6, hy - 30); ctx.lineTo(kx + 34, hy - 18); ctx.lineTo(kx + 52, hy); ctx.fill();

  ctx.restore();
  ctx.strokeStyle = "rgba(255,200,140,.35)"; ctx.lineWidth = 1.2;
  for (let i = 0; i < 9; i++) {
    const y = hy + 8 + i * 13, w = 26 - i * 1.5, x = cw * 0.74 + Math.sin(t / 900 + i) * 6 - w / 2;

}

/* ---------- Duvarlar ---------- */
function lerpP(a, b, u) { return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u }; }
function wq(p1, p2, u0, u1, v0, v1) {
  const a = lerpP(p1, p2, u0), b = lerpP(p1, p2, u1);
  return [[a.x, a.y - v0 * WALL_H], [b.x, b.y - v0 * WALL_H], [b.x, b.y - v1 * WALL_H], [a.x, a.y - v1 * WALL_H]];

  poly(wq(p1, p2, 0, 1, 0, 1), base);
  poly(wq(p1, p2, 0, 1, 0, 0.07), base2);
  if (feat === "window") {
    poly(wq(p1, p2, 0.1, 0.22, 0.3, 0.8), "#2B8F8A");

    poly(wq(p1, p2, 0.3, 0.5, 0.36, 0.72), lit ? "rgba(246,178,107,.55)" : "rgba(246,178,107,.3)");
    poly(wq(p1, p2, 0.24, 0.76, 0.27, 0.31), "#F7EFE2");

}
function drawWalls(r, t) {
  for (let x = 0; x < r.w; x++) drawWallSeg(iso(x - 0.5, -0.5), iso(x + 0.5, -0.5), "#F1E4D3", "#D8C8B2", r.windows.y.includes(x) ? "window" : null, true);
  for (let y = 0; y < r.h; y++) {
    const feat = r.doors["0," + y] ? "door" : r.windows.x.includes(y) ? "window" : null;
    drawWallSeg(iso(-0.5, y - 0.5), iso(-0.5, y + 0.5), "#D9C7B2", "#C0AE98", feat, false);

function drawLights(r, t) {

    for (let i = 2; i < pts.length; i += 4) {

      g.addColorStop(0, "rgba(255,200,110," + (0.8 * fl) + ")"); g.addColorStop(1, "rgba(255,200,110,0)");
      ctx.fillStyle = g; ctx.fillRect(x - 9, y - 9, 18, 18);

}

/* ---------- Zemin ---------- */
function drawPlatformSides(r) {
  const T = 16, wood = r.floor === "wood";
  const c1 = wood ? "#7A5136" : "#B9A88F", c2 = wood ? "#64412B" : "#A39177";
  for (let y = 0; y < r.h; y++) { const a = iso(r.w - 0.5, y - 0.5), b = iso(r.w - 0.5, y + 0.5); poly([[a.x, a.y], [b.x, b.y], [b.x, b.y + T], [a.x, a.y + T]], c1); }
  for (let x = 0; x < r.w; x++) { const a = iso(x + 0.5, r.h - 0.5), b = iso(x - 0.5, r.h - 0.5); poly([[a.x, a.y], [b.x, b.y], [b.x, b.y + T], [a.x, a.y + T]], c2); }
}
function drawFloor(r, t) {
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const k = r.map[y][x], p = iso(x, y), d = diamond(p.x, p.y);
    if (k === "~") { drawWater(r, x, y, p, t); continue; }
    if (r.floor === "wood") {
      poly(d, (x + y) % 2 ? "#B07B4F" : "#A97449");
      ctx.strokeStyle = "rgba(70,40,20,.25)"; ctx.lineWidth = 1;
      for (let i = 1; i < 3; i++) { const a = iso(x - 0.5, y - 0.5 + i / 3), b = iso(x + 0.5, y - 0.5 + i / 3); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      poly(d, null, "rgba(70,40,20,.3)", 1);
    } else {
      poly(d, (x + y) % 2 ? "#ECE0CD" : "#E3D5BF");
      if (hash(x, y) > 0.7) poly(diamond(p.x, p.y, 0.5), "rgba(190,165,130,.18)");
      poly(d, null, "rgba(120,100,80,.2)", 1);

}
function drawWater(r, x, y, p, t) {
  poly(diamond(p.x, p.y), "#2BB3A3");
  const isW = (a, b) => tileAt(r, a, b) === "~";
  const T = [p.x, p.y - TH / 2], R = [p.x + TW / 2, p.y], B = [p.x, p.y + TH / 2], L = [p.x - TW / 2, p.y];
  if (!isW(x, y - 1)) poly([T, R, [R[0], R[1] + 7], [T[0], T[1] + 7]], "#1C8584");
  if (!isW(x - 1, y)) poly([L, T, [T[0], T[1] + 7], [L[0], L[1] + 7]], "#187675");
  for (let i = 0; i < 2; i++) {
    const ph = t / 700 + hash(x, y) * 6 + i * 2.1, ox = Math.sin(ph) * 9, oy = Math.cos(ph * 0.8) * 3 + (i ? 4 : -2);
    ctx.strokeStyle = "rgba(220,255,250," + (0.25 + 0.2 * Math.sin(ph * 1.3)) + ")"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(p.x + ox - 7, p.y + oy); ctx.lineTo(p.x + ox + 7, p.y + oy); ctx.stroke();

}
function drawOverlays(t) {

  for (const [x, y] of player.path) { const p = iso(x, y); ellipse(p.x, p.y, 3, 1.6, "rgba(242,140,40,.85)"); }
  if (state.target) {

/* ---------- Objeler ---------- */
function drawObject(r, o) {
  const { x, y, k } = o, p = iso(x, y);
  if (k === "L") {
    const back = r.loungerBack[x + "," + y] || -1;
    ellipse(p.x, p.y + 2, 20, 9, "rgba(30,20,20,.16)");
    isoBox(x, y, 0.44, 0.86, 5, 2, "#FFFFFF", "#CFC6B8", "#E2DACD");
    isoBox(x, y + back * 0.04, 0.38, 0.72, 3, 7, "#F28C28", "#C9641A", "#DD7A22");
    isoBox(x, y + back * 0.34, 0.44, 0.16, 12, 7, "#FFFFFF", "#CFC6B8", "#E2DACD");
  } else if (k === "U") {

    ctx.strokeStyle = "#EDE3D3"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 50); ctx.stroke();
    const cy = p.y - 46, n = 10, segs = [];

    segs.sort((a, b) => a.s - b.s);
    for (const sg of segs) poly([[p.x, cy - 14], [p.x + Math.cos(sg.a0) * 30, cy + Math.sin(sg.a0) * 12], [p.x + Math.cos(sg.a1) * 30, cy + Math.sin(sg.a1) * 12]], sg.i % 2 ? "#F3E9DC" : "#F28C28");
  } else if (k === "T") {
    ellipse(p.x, p.y + 2, 22, 10, "rgba(30,20,20,.2)");
    isoBox(x, y, 0.42, 0.42, 11, 0, "#B4613A", "#8E4527", "#A4532F");
    ctx.fillStyle = "#6B4A2E"; ctx.fillRect(p.x - 2, p.y - 30, 4, 22);
    const cy = p.y - 42;
    circle(p.x - 11, cy + 4, 13, "#2F6B3A"); circle(p.x + 11, cy + 3, 13, "#2F6B3A");
    circle(p.x, cy - 8, 15, "#3B7F45"); circle(p.x - 5, cy + 7, 12, "#34763F"); circle(p.x + 6, cy - 2, 11, "#468D50");
    for (const [ox, oy] of [[-12, 2], [8, -10], [13, 6], [-4, -14], [-1, 9], [-15, -6]]) circle(p.x + ox, cy + oy, 2.6, "#F28C28");
  } else if (k === "P") {
    ellipse(p.x, p.y + 1, 14, 6, "rgba(30,20,20,.18)");
    isoBox(x, y, 0.42, 0.42, 13, 0, "#C46A3D", "#9A4C27", "#B05B32");
    const cy = p.y - 20;
    circle(p.x - 6, cy, 8, "#3B7F45"); circle(p.x + 6, cy, 8, "#34763F"); circle(p.x, cy - 7, 9, "#468D50");
  } else if (k === "K") {

    isoBox(x, y, 0.16, 0.16, 14, 0, "#6B4A2E", "#523822", "#5E4129");
    isoBox(x, y, 0.72, 0.72, 3, 14, "#F3E9DC", "#C9BBA6", "#DCCEB8");

    ellipse(p.x, p.y + 1, 12, 5, "rgba(30,20,20,.16)");

    isoBox(x + bx * 0.16, y + by * 0.16, bx ? 0.06 : 0.36, by ? 0.06 : 0.36, 12, 8, "#2BB3A3", "#1C8584", "#23A093");
  } else if (k === "B") {

      const a = iso(x + ox, y); ctx.fillStyle = col; ctx.fillRect(a.x - 2, a.y - 36, 4, 10); ctx.fillRect(a.x - 1, a.y - 39, 2, 3);
    }
  }
}
function drawRailing(r) {

  ctx.beginPath(); ctx.arc(0, -57, d.hs === "buzz" ? 6.7 : 7, Math.PI, Math.PI * 2); ctx.closePath(); ctx.fill();
  ellipse(-3.8, -55, 3.6, d.hs === "buzz" ? 3.5 : 5.2, hc);
  if (d.hs === "short") ellipse(2.5, -62, 4.6, 2.3, hc);
  if (d.hs === "wavy") { ellipse(-4.6, -51.5, 4, 7.5, hc); ellipse(6.1, -54, 1.6, 4, hc); circle(-6.2, -45, 2.6, hc); circle(-2.6, -45.6, 2.3, hc); }
  if (d.hs === "long") ellipse(-4.4, -53, 3.6, 6.5, hc);
  if (d.hs === "bun") circle(-3, -64.5, 3.4, hc);
  if (d.hs === "curly") for (let i = 0; i <= 6; i++) { const a = Math.PI + i / 6 * Math.PI; circle(Math.cos(a) * 6.4, -57 + Math.sin(a) * 6.4, 2.7, hc); }
}
function hairBack(d) {
  const hc = d.hair;
  circle(0, -56, 6.9, hc);
  ctx.fillStyle = hc;
  if (d.hs === "long") { ctx.beginPath(); ctx.roundRect(-6.5, -57, 13, 20, 4); ctx.fill(); }
  if (d.hs === "wavy") { ctx.beginPath(); ctx.roundRect(-7, -57, 14, 12, 5); ctx.fill(); }
  if (d.hs === "bun") circle(0, -64, 3.4, hc);
  if (d.hs === "pony") ellipse(0, -49, 2.6, 6, hc);
  if (d.hs === "curly") for (let i = 0; i <= 8; i++) { const a = i / 8 * Math.PI * 2; circle(Math.cos(a) * 6.2, -56 + Math.sin(a) * 6.2, 2.6, hc); }
}
function drawChar(c) {
  const d = c.def, p = iso(c.x, c.y);
  const swing = c.moving ? Math.sin(c.walkT) * 3.2 : 0;
  const bob = c.moving ? Math.abs(Math.sin(c.walkT)) * 1.2 : 0;
  ctx.save();
  ctx.translate(p.x, p.y);
  if (c === player) { ctx.strokeStyle = "rgba(242,140,40,.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 13, 6, 0, 0, Math.PI * 2); ctx.stroke(); }
  else if (dlg && dlg.n === c) { ctx.strokeStyle = "rgba(255,107,139,.9)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(0, 0, 13, 6, 0, 0, Math.PI * 2); ctx.stroke(); }
  ellipse(0, 0, c.sit ? 13 : 10, c.sit ? 5 : 4, "rgba(20,15,30,.24)");
  if (!c.right) ctx.scale(-1, 1);
  const sitOff = c.sit ? 13 : 0;
  const lower = d.legs === "pants" ? d.bottom : d.skin;
  if (c.sit) {
    for (const off of [-1.6, 1.6]) {
      line(-1, -12 + off, 7, -11 + off, 5, d.legs === "dress" ? d.skin : d.bottom);
      line(7, -11 + off, 10, -3 + off, 4.4, lower);
      ellipse(11, -2 + off, 2.8, 1.6, "#2A2420");
    }
  } else {
    for (const [hx, fx] of [[-2.8, -2.8 + swing], [2.8, 2.8 - swing]]) {
      line(hx, -25, fx, -2, 5, lower);
      if (d.legs === "shorts") line(hx, -25, hx + (fx - hx) * 0.4, -16, 5.4, d.bottom);
      ellipse(fx + 1, -1.2, 3.2, 1.8, "#2A2420");
    }
  }
  ctx.translate(0, sitOff - bob);
  if (d.legs === "dress") poly([[-6.5, -32], [6.5, -32], [9, -15], [-9, -15]], d.bottom);
  const sh = c.front ? 1 : -1;
  line(-7.5 * sh, -43, (-8.8 - swing * 0.6) * sh, -27, 3.6, d.skin);
  line(-7.5 * sh, -43, (-8.2 - swing * 0.25) * sh, -37, 4.4, d.top);
  hairBehind(d);
  rrect(-7, -47, 14, 22, 4, d.top);
  rrect(c.front ? 0 : -7, -47, 7, 22, 3, "rgba(255,255,255,.08)");
  line(7.5 * sh, -43, (8.8 + swing * 0.6) * sh, -27, 3.6, d.skin);
  line(7.5 * sh, -43, (8.2 + swing * 0.25) * sh, -37, 4.4, d.top);
  ctx.fillStyle = d.skin; ctx.fillRect(-2, -51, 4, 5);
  circle(0, -56, 6.4, d.skin);
  if (c.front) {
    hairFront(d);
    if (d.beard) { ctx.fillStyle = d.hair; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(0.8, -55.5, 6.2, 0.08 * Math.PI, 0.92 * Math.PI); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
    circle(1.2, -55.4, 0.95, "#2A1A14"); circle(4.2, -55.4, 0.95, "#2A1A14");
    if (d.blush) ellipse(4.8, -53.6, 1.3, 0.7, "rgba(230,110,90,.4)");
    ctx.strokeStyle = d.beard ? "#E9CFB8" : "#7A3F2E"; ctx.lineWidth = 0.9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(2.8, -53.4, 1.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  } else hairBack(d);
  ctx.restore();
}

/* ---------- Etiketler ve balonlar ---------- */
function wrap(text, maxW) {
  const words = text.split(" "), lines = [];
  let cur = "";
  for (const w of words) { const t = cur ? cur + " " + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  return lines;
}
function drawLabels(chars, t) {
  const placed = [];
  const viewL = state.cam.x - cw / (2 * z) + 6, viewR = state.cam.x + cw / (2 * z) - 6;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const c of chars) {
    const p = iso(c.x, c.y), headTop = p.y - (c.sit ? 50 : 63);
    ctx.font = "800 9px Manrope, system-ui, sans-serif";
    const isNew = c.arrivedDay && c.arrivedDay === state.day && state.day > 1;
    const nm = c.def.name + (isNew ? " · yeni" : "");
    const hasHeart = shownMatch(c);
    const nw = ctx.measureText(nm).width + 10 + (hasHeart ? 11 : 0);
    rrect(p.x - nw / 2, headTop - 15, nw, 12, 6, c === player ? "#F28C28" : isNew ? "#2BB3A3" : "rgba(17,28,46,.78)");
    if (hasHeart) heart(p.x - nw / 2 + 8, headTop - 9.2, 3.4, c === player ? "#1B2A41" : "#FF6B8B");
    ctx.fillStyle = c === player || isNew ? "#1B2A41" : "#F3E9DC";
    ctx.fillText(nm, p.x + (hasHeart ? 5.5 : 0), headTop - 8.6);
    const b = c.bubble;
    if (!b || NOW > b.until) continue;
    ctx.font = "700 11px Manrope, system-ui, sans-serif";
    const lines = wrap(b.text, 138);
    const lw = Math.max(...lines.map(l => ctx.measureText(l).width));
    const bw = lw + 16, bh = lines.length * 14 + 10;
    let bx = Math.max(viewL, Math.min(viewR - bw, p.x - bw / 2)), by = headTop - 20 - bh;
    for (let guard = 0; guard < 6; guard++) {
      const hit = placed.find(q => bx < q.x + q.w && bx + bw > q.x && by < q.y + q.h && by + bh > q.y);
      if (!hit) break;
      by = hit.y - bh - 4;
    }
    placed.push({ x: bx, y: by, w: bw, h: bh });
    const tx = bx + bw / 2, tailX = Math.max(bx + 10, Math.min(bx + bw - 10, p.x));
    ctx.globalAlpha = Math.min(1, (b.until - NOW) / 250);
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9);
    if (by + bh > headTop - 24) { ctx.moveTo(tailX - 5, by + bh); ctx.lineTo(tailX, by + bh + 6); ctx.lineTo(tailX + 5, by + bh); }
    ctx.fillStyle = c === player ? "#FFF1E2" : "#FFFDF8"; ctx.fill();
    if (b.alert) { ctx.strokeStyle = "#E4572E"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9); ctx.stroke(); }
    ctx.fillStyle = "#1B2A41";
    lines.forEach((l, i) => ctx.fillText(l, tx, by + 12 + i * 14));
    ctx.globalAlpha = 1;
  }
}
function drawDoorTags(r, t) {
  ctx.font = "800 9px Manrope, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const key in r.doors) {
    const [x, y] = key.split(",").map(Number), p = iso(x, y), label = r.doors[key].label + " ›";
    const w = ctx.measureText(label).width + 12, yy = p.y - 16 + Math.sin(t / 400) * 1.5;
    rrect(p.x - w / 2, yy - 7, w, 14, 7, "#F28C28");
    ctx.fillStyle = "#1B2A41"; ctx.fillText(label, p.x, yy);
  }
}

/* ---------- Ana döngü ---------- */
function render(t) {
  const r = room();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackdrop(t);
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (cw / 2 - state.cam.x * z), dpr * (ch / 2 - state.cam.y * z));
  drawWalls(r, t);
  drawPlatformSides(r);
  drawFloor(r, t);
  drawOverlays(t);
  const chars = npcs.filter(n => n.room === state.room).concat(player);
  const items = r.objects.map(o => ({ d: o.x + o.y, f: () => drawObject(r, o) }))
    .concat(chars.map(c => ({ d: c.x + c.y + 0.05 + (c.sit ? 0.05 : 0), f: () => drawChar(c) })));
  items.sort((a, b) => a.d - b.d);
  for (const it of items) it.f();
  drawRailing(r);
  drawDoorTags(r, t);
  drawLabels(chars.sort((a, b) => (a.x + a.y) - (b.x + b.y)), t);
}
let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; NOW = ts;
  if (player) {
    step(player, dt);
    for (const n of npcs.slice()) updateNPC(n, dt);
    scheduleTalks();
    updateCamera(dt);
    updateHud();
    render(ts);
  }
  requestAnimationFrame(frame);
}

/* ---------- Oyun kurulumu ---------- */
function buildCast(gender, name) {
  npcs = []; byId = {};
  for (const id in BASE) {
    const [rm, x, y, sit, face] = START_POS[id];
    const c = mkChar(id, withDefaults(BASE[id]), rm, x, y, { sit, face });
    npcs.push(c); byId[id] = c;
  }
  player = mkChar("sen", withDefaults(Object.assign({ name, g: gender, likes: [], dislikes: [] }, PLAYER_LOOK[gender])), "havuz", 5, 11, { face: [1, 1], speed: 3.1 });
  byId.sen = player;
  // tohum uyumları: dizideki ilişki haritasıyla uyumlu başlangıç
  setChem(byId.bora, byId.nehir, 6); setChem(byId.tolga, byId.defne, 6);
  setChem(byId.arda, byId.ece, 5); setChem(byId.kaan, byId.selin, 4);
}
function beginGame(gender, name) {
  state.room = "havuz"; state.day = 1; state.phase = "day";
  state.talked = new Set(); state.chem = new Map(); state.matchOf = {}; state.revealed = new Set(); state.metPlayer = new Set();
  state.pool = { F: NEWCOMERS.F.slice(), M: NEWCOMERS.M.slice() };
  state.galaReadyShown = false; state.target = null; state.nextSchedule = NOW + 2500;
  buildCast(gender, name);
  $("room-name").textContent = ROOMS.havuz.name;
  lastHud = ""; updateHud();
  snapCamera();
  const opp = npcs.filter(n => n.def.g !== gender).map(n => n.def.name);
  later(500, () => toast("Gün 1. Galadan önce konuşman gerekenler: " + opp.join(", ")));
}
function newGame() {
  closeDialog();
  state.phase = "start";
  buildCast("F", "Deniz");
  snapCamera();
  openStart();
}

/* Otomatik testler için küçük kanca */
window.__villa = {
  tileToScreen(x, y, up = 0) { const p = iso(x, y); return { x: (p.x - state.cam.x) * z + cw / 2, y: (p.y - up - state.cam.y) * z + ch / 2 }; },
  info() { const tp = talkProgress(); return { room: state.room, day: state.day, phase: state.phase, x: player.x, y: player.y, match: state.matchOf[player.id] || null, done: tp.done, total: tp.total, npcs: npcs.map(n => n.id + ":" + n.room + ":" + n.mode), dialog: !!dlg }; },
  pending() { return housePairs().filter(([a, b]) => !talked(a, b)).map(([a, b]) => a.id + "-" + b.id); },
  pos(id) { const c = byId[id]; return c ? { x: c.x, y: c.y, room: c.room, mode: c.mode } : null; },
};

newGame();
requestAnimationFrame(frame);
})();
