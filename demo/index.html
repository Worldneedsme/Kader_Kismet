<meta charset="utf-8">
<title>Alanya Villa Prototipi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: tek dikey oyun sütunu; üstte HUD, ortada izometrik dünya, altta sohbet ve aksiyonlar */
:root {
  --gece: #1B2A41;
  --gece-derin: #111C2E;
  --panel: #22344F;
  --panel-acik: #2F4769;
  --turunc: #F28C28;
  --kum: #F3E9DC;
  --deniz: #2BB3A3;
  --mercan: #E4572E;
  --limon: #F2C14E;
  --gri: #9AA7BC;
  --f-baslik: "Fraunces", Georgia, "Times New Roman", serif;
  --f-arayuz: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--gece-derin);
  color: var(--kum);
  font-family: var(--f-arayuz);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-sizing: border-box;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { display: flex; align-items: center; gap: 8px; }
.me { display: flex; align-items: center; gap: 8px; min-width: 0; }
.portrait {
  width: 38px; height: 38px; flex: none;
  border-radius: 50%;
  background: var(--turunc); color: var(--gece);
  border: 2px solid var(--kum);
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px;
}
.me-info { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.me-name { font-weight: 800; font-size: 13px; line-height: 1; }
.trust { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gri); font-weight: 600; }
.trust-bar { width: 58px; height: 6px; border-radius: 3px; background: var(--panel-acik); overflow: hidden; }
.trust-fill { height: 100%; width: 60%; background: var(--deniz); transition: width .4s ease, background-color .4s ease; }
.trust-val { font-variant-numeric: tabular-nums; color: var(--kum); }
.clock {
  margin-left: auto;
  display: flex; flex-direction: column; align-items: center;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 4px 10px;
}
.clock-label { white-space: nowrap; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--turunc); font-weight: 800; }
.clock-time { font-family: var(--f-baslik); font-weight: 700; font-size: 17px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.cards-count {
  display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 8px 10px;
  color: var(--kum); font: 800 14px var(--f-arayuz);
  cursor: pointer;
}
.cards-count svg { width: 16px; height: 16px; }
.cards-count.pulse { animation: pulse .8s ease 3; }
@keyframes pulse { 50% { transform: scale(1.12); border-color: var(--turunc); } }

.stage {
  position: relative; flex: 1; min-height: 0;
  border-radius: 18px; overflow: hidden;
  background: var(--gece);
  box-shadow: 0 0 0 1px var(--panel-acik);
}
#game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
.chip {
  position: absolute; top: 10px;
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 800;
  pointer-events: none;
}
.room-chip { left: 10px; background: rgba(17, 28, 46, .82); color: var(--kum); border: 1px solid var(--panel-acik); }
.room-chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--deniz); }
.hide-chip { right: 10px; background: var(--limon); color: var(--gece); }
.toasts {
  position: absolute; left: 12px; right: 12px; top: 48px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  max-width: 100%; box-sizing: border-box;
  background: rgba(17, 28, 46, .94); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 8px 12px;
  font-size: 13px; font-weight: 700; text-align: center;
  animation: toast-in .25s ease;
}
.toast.good { border-color: var(--deniz); }
.toast.bad { border-color: var(--mercan); }
.toast.gold { border-color: var(--turunc); }
@keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
.fade { position: absolute; inset: 0; background: var(--gece-derin); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.fade.on { opacity: 1; }

.chat { display: flex; gap: 8px; }
.chat input {
  flex: 1; min-width: 0;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 10px 12px;
  color: var(--kum); font: 600 14px var(--f-arayuz);
}
.chat input::placeholder { color: var(--gri); }
.send {
  flex: none; border: 0; border-radius: 12px; padding: 0 14px;
  background: var(--turunc); color: var(--gece);
  font: 800 13px var(--f-arayuz); cursor: pointer;
}
.actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 12px; padding: 7px 4px;
  color: var(--kum); font: 700 11px var(--f-arayuz);
  cursor: pointer;
}
.act svg { width: 20px; height: 20px; }
.act:active, .send:active, .cards-count:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--turunc); outline-offset: 2px; }

.modal-back {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(8, 13, 24, .7);
  display: grid; place-items: center;
  padding: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal {
  width: 100%; max-width: 380px; max-height: 100%; overflow: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--panel-acik);
  border-radius: 18px; padding: 20px;
  display: flex; flex-direction: column; gap: 12px;
}
.modal h2 { margin: 0; font-family: var(--f-baslik); font-weight: 700; font-size: 23px; line-height: 1.15; text-wrap: balance; }
.modal p { margin: 0; color: var(--gri); font-size: 14px; line-height: 1.5; }
.modal ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.45; }
.modal .eyebrow { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--turunc); font-weight: 800; }
.btn {
  border: 0; border-radius: 12px; padding: 12px 14px;
  background: var(--turunc); color: var(--gece);
  font: 800 14px var(--f-arayuz); cursor: pointer;
}
.btn.ghost { background: var(--gece); color: var(--kum); border: 1px solid var(--panel-acik); }
.card-list, .room-list { display: flex; flex-direction: column; gap: 10px; }
.card {
  display: flex; flex-direction: column; gap: 4px;
  padding: 12px 14px; border-radius: 14px;
  background: var(--gece); border: 1px dashed var(--panel-acik);
}
.card.found { border: 1px solid var(--turunc); }
.card .eyebrow { color: var(--gri); }
.card.found .eyebrow { color: var(--turunc); }
.card h3 { margin: 0; font-family: var(--f-baslik); font-size: 17px; }
.card p { font-size: 13px; }
.room-btn { display: flex; justify-content: space-between; align-items: center; text-align: left; }
.room-btn small { font-weight: 700; opacity: .7; }
@media (prefers-reduced-motion: reduce) {
  .toast, .cards-count.pulse { animation: none; }
  .fade, .trust-fill { transition: none; }
}
</style>

<div class="app" lang="tr">
  <header class="hud">
    <div class="me">
      <div class="portrait" aria-hidden="true">Sen</div>
      <div class="me-info">
        <span class="me-name">Yeni misafir</span>
        <span class="trust">Güven
          <span class="trust-bar"><span class="trust-fill" id="trust-fill"></span></span>
          <span class="trust-val" id="trust-val">60</span>
        </span>
      </div>
    </div>
    <div class="clock" title="Haftalık oylama gecesine kalan süre">
      <span class="clock-label">Yüzleşme Saati</span>
      <span class="clock-time" id="clock">02:14:37</span>
    </div>
    <button class="cards-count" id="cards-btn" type="button" aria-label="Sır kartları">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="1.8" width="10" height="12.4" rx="2"/><path d="M5.8 6.2 8 8.4l2.2-2.2"/></svg>
      <span id="cards-n">0/2</span>
    </button>
  </header>

  <main class="stage" id="stage">
    <canvas id="game" aria-label="Villa oyun alanı. Zemine dokunarak yürü."></canvas>
    <div class="chip room-chip"><i></i><span id="room-name">Havuz Başı</span></div>
    <div class="chip hide-chip" id="hide-chip" hidden>Saklanıyorsun</div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="fade" id="fade"></div>
  </main>

  <form class="chat" id="chat" autocomplete="off">
    <input id="chat-input" maxlength="80" placeholder="Bir şey söyle..." aria-label="Mesaj">
    <button class="send" type="submit">Gönder</button>
  </form>

  <nav class="actions">
    <button class="act" type="button" id="btn-wave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12"/><path d="M11 11V4.5a1.5 1.5 0 0 1 3 0V11"/><path d="M14 11V6a1.5 1.5 0 0 1 3 0v7a7 7 0 0 1-7 7h-.5A6.5 6.5 0 0 1 4 15.5L3 12a1.5 1.5 0 0 1 2.7-1.2L8 14"/></svg>
      Selam
    </button>
    <button class="act" type="button" id="btn-map">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
      Harita
    </button>
    <button class="act" type="button" id="btn-cards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M9.5 10 12 12.5 14.5 10"/></svg>
      Kartlar
    </button>
    <button class="act" type="button" id="btn-help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><path d="M12 16.8v.1"/></svg>
      Yardım
    </button>
  </nav>
</div>

<div class="modal-back" id="modal" lang="tr" hidden>
  <div class="modal" id="modal-body" role="dialog" aria-modal="true"></div>
</div>

<script>
(() => {
"use strict";
document.documentElement.lang = "tr";

/* ---------- Sabitler ---------- */
const TW = 64, TH = 32, WALL_H = 96;
const SKY_PRESET = { sun: "#FFC56B" };

/* ---------- Haritalar ----------
   .  zemin        Z  saklanma alanı   D  kapı
   ~  havuz        L  şezlong          U  şemsiye
   T  turunç ağacı P  saksı            K  masa
   N  notlu masa   C  sandalye         B  bar tezgâhı        */
const ROOMS = {
  havuz: {
    name: "Havuz Başı", floor: "stone",
    map: [
      "P..........P",
      "........ZT..",
      "D.......ZT..",
      "........ZT..",
      "........ZP..",
      ".L~~~~~U....",
      "..~~~~~L....",
      ".L~~~~~L....",
      "..~~~~~U....",
      ".L~~~~~.....",
      "............",
      "............",
      "............",
      "P....P.....P",
    ],
    doors: { "0,2": { to: "teras", at: [1, 4], label: "Teras" } },
    windows: { y: [2, 5, 10], x: [6, 9, 12] },
    loungerBack: { "7,7": 1 },
  },
  teras: {
    name: "Teras", floor: "wood",
    map: [
      "P.BBB....P",
      "..........",
      "..CKC..P..",
      "..........",
      "D....CNC..",
      "..........",
      "..........",
      "..P.......",
      "..........",
      "P........P",
    ],
    doors: { "0,4": { to: "havuz", at: [1, 2], label: "Havuz Başı" } },
    windows: { y: [6, 8], x: [1, 7] },
    railing: true,
    lights: true,
  },
};
for (const id in ROOMS) {
  const r = ROOMS[id];
  r.id = id; r.h = r.map.length; r.w = r.map[0].length;
  r.objects = [];
  r.loungerBack = r.loungerBack || {};
  for (let y = 0; y < r.h; y++) for (let x = 0; x < r.w; x++) {
    const ch = r.map[y][x];
    if ("LUTPKNCB".includes(ch)) r.objects.push({ x, y, k: ch });
  }
}
const WALK = new Set([".", "Z", "D"]);
const SIT = new Set(["L", "C"]);
const tileAt = (r, x, y) => (x < 0 || y < 0 || x >= r.w || y >= r.h) ? null : r.map[y][x];

/* ---------- Karakterler ---------- */
const DEFS = {
  sen:   { name: "Sen",   skin: "#CFA07E", hair: "#4A2F1F", hs: "short", top: "#F28C28", bottom: "#24364F", legs: "pants" },
  nehir: { name: "Nehir", skin: "#C99A76", hair: "#3B2418", hs: "wavy",  top: "#F3E9DC", bottom: "#2BB3A3", legs: "shorts", blush: true,
    talk: ["Selam! Havuz harika, değil mi?", "Burada herkes bir şey saklıyor gibi.", "Bora'yı tanıyor musun? Ben de tam emin değilim."],
    greet: ["Selam! Hoş geldin.", "Hey, nasılsın?"],
    replies: ["Haha, olabilir.", "Bunu kimseye söyleme ama katılıyorum.", "Bana yalan söyleme, yeter."] },
  bora:  { name: "Bora",  skin: "#B98463", hair: "#2A1D14", hs: "short", top: "#2D5D7B", bottom: "#E8DCC6", legs: "shorts",
    talk: ["Hey! Aramızda yelken bilen var mı?", "Acele etmeyelim, daha ilk gün.", "Bakarız, her şey olacağına varır."],
    greet: ["Selam dostum.", "Hey! Gel otur istersen."],
    replies: ["Bakarız.", "Acele etme, daha ilk gün.", "Olabilir, kim bilir."] },
  selin: { name: "Selin", skin: "#E0B48F", hair: "#17120F", hs: "long",  top: "#4A3A5E", bottom: "#4A3A5E", legs: "dress" },
  kaan:  { name: "Kaan",  skin: "#A8724F", hair: "#1A1410", hs: "buzz",  top: "#7A8B5A", bottom: "#2B2F3A", legs: "pants", beard: true },
  defne: { name: "Defne", skin: "#EBC3A0", hair: "#B5562B", hs: "bun",   top: "#F2C14E", bottom: "#2B4C7E", legs: "shorts", blush: true,
    talk: ["Durun durun, size bir şey anlatmam lazım!", "Selin ile Kaan neden hep o köşede?", "Ben bir şey demedim ama... herkes biliyor."],
    greet: ["Selaaam! Yeni geldin, değil mi?", "Hey! Sana anlatacak çok şeyim var."],
    replies: ["Aaa, gerçekten mi?", "Bunu podcast'te anlatırım.", "Dur, bunu Nehir'e söylemem lazım."] },
  tolga: { name: "Tolga", skin: "#D2A07D", hair: "#3A2A20", hs: "short", top: "#FFFFFF", bottom: "#5B6B8A", legs: "pants",
    talk: ["Oyun değil bu, ama kurallarını bilmek lazım.", "Benimle takılırsan güvende olursun.", "Herkesin bir planı var. Seninki ne?"],
    greet: ["Selam, otur bakalım.", "Hey, yeni yüz!"],
    replies: ["Mantıklı.", "Bunu aklımda tutacağım.", "Haha, sen iyisin."] },
  ece:   { name: "Ece",   skin: "#D8A784", hair: "#5A3A24", hs: "pony",  top: "#E4572E", bottom: "#F3E9DC", legs: "pants",
    talk: ["Yüzüme söyle, arkamdan değil.", "Dedikoduyla insan harcanmaz.", "Bu villada dürüst kaç kişi kaldı?"],
    greet: ["Selam.", "Merhaba, hoş geldin."],
    replies: ["Hmm.", "Açık konuş.", "Tamam, inandım diyelim."] },
  arda:  { name: "Arda",  skin: "#B07A55", hair: "#2A1C12", hs: "curly", top: "#2BB3A3", bottom: "#3B3B3B", legs: "pants",
    talk: ["Bazı şeyler söylenince bozuluyor.", "Masada bir not unuttum galiba... Yok, boş ver.", "Deniz bu saatte en güzel hâlinde."],
    greet: ["Selam.", "Ah, merhaba."],
    replies: ["Belki.", "Bilmiyorum...", "Sen de mi fark ettin?"] },
};

let NOW = 0;
function mkChar(id, room, x, y, o = {}) {
  const c = { id, def: DEFS[id], room, x, y, path: [], speed: o.speed || 3.1, right: true, front: true,
    sit: !!o.sit, walkT: 0, moving: false, bubble: null, wander: !!o.wander, action: null,
    nextWander: 2500, nextChat: 7000, pauseUntil: 0, talkI: 0 };
  if (o.face) setFace(c, o.face[0], o.face[1]);
  return c;
}
function setFace(c, dx, dy) {
  if (Math.abs(dx) < 1e-4 && Math.abs(dy) < 1e-4) return;
  c.right = (dx - dy) >= -1e-4;
  if (Math.abs(dx + dy) > 1e-3) c.front = (dx + dy) > 0;
}

const player = mkChar("sen", "havuz", 5, 11, { face: [1, 1] });
player.isPlayer = true;
const npcs = [
  mkChar("nehir", "havuz", 7, 6, { sit: true, face: [0, 1] }),
  mkChar("bora",  "havuz", 7, 7, { sit: true, face: [0, -1] }),
  mkChar("selin", "havuz", 10, 2, { face: [1, 0] }),
  mkChar("kaan",  "havuz", 11, 2, { face: [-1, 0] }),
  mkChar("defne", "havuz", 4, 11, { wander: true, speed: 1.8 }),
  mkChar("tolga", "teras", 2, 2, { sit: true, face: [1, 0] }),
  mkChar("ece",   "teras", 4, 2, { sit: true, face: [-1, 0] }),
  mkChar("arda",  "teras", 8, 7, { face: [1, 1] }),
];
const byId = Object.fromEntries(npcs.map(n => [n.id, n]));
byId.sen = player;

/* ---------- Konuşmalar ---------- */
const CONVOS = [
  { id: "havuz", room: "havuz", members: ["nehir", "bora"], secret: false, lines: [
    ["bora", "Su biraz soğuk ama manzara buna değer."],
    ["nehir", "Manzara mı, havuz mu?"],
    ["bora", "İkisi de. Bir de sen."],
    ["nehir", "Bu repliği bugün kaç kişiye söyledin?"],
    ["bora", "Sayarsak... sadece sana."],
    ["nehir", "Bakarız."],
  ] },
  { id: "sir", room: "havuz", members: ["selin", "kaan"], secret: true, lines: [
    ["kaan", "Kimseyi tanımıyor musun gerçekten?", true],
    ["selin", "Burada değil. Lütfen.", true],
    ["kaan", "Üç yıl oldu Selin. Hiçbir şey demeyecek misin?", true],
    ["selin", "Cumartesiye kadar. Sonra kendim söylerim.", true],
    ["kaan", "Peki. Şimdilik."],
  ] },
  { id: "teras", room: "teras", members: ["tolga", "ece"], secret: false, lines: [
    ["tolga", "Bu villada herkes bir oyun oynuyor, fark ettin mi?"],
    ["ece", "Sen hariç mi?"],
    ["tolga", "Ben sadece kurallarını biliyorum."],
    ["ece", "Yüzüme söyle o zaman. Kimi hedefliyorsun?"],
    ["tolga", "Şimdilik kimseyi. Yüzleşme Saati'ne kadar."],
  ] },
];
for (const cv of CONVOS) {
  cv.i = 0; cv.next = 1500 + Math.random() * 1500; cv.blocked = false; cv.caught = false;
  cv.heard = new Set(); cv.keyCount = cv.lines.filter(l => l[2]).length;
}
const SECRET = CONVOS.find(c => c.id === "sir");

const CARDS = [
  { id: "selin-kaan", title: "Eski tanıdıklar", where: "Havuz Başı",
    text: "Selin ve Kaan birbirini üç yıldır tanıyor. Selin girişte bunu sakladı ve cumartesiye kadar açıklayacağını söyledi.",
    hint: "Havuz başında biri bir şey saklıyor. Sarı köşeden dinle." },
  { id: "not", title: "İmzasız not", where: "Teras",
    text: "Teras masasında katlanmış bir not: \"Her sabah ilk seni arıyorum ama söyleyemiyorum.\" El yazısı Arda'nınkine benziyor.",
    hint: "Terasta masalardan birinde unutulmuş bir şey var." },
];

/* ---------- Durum ---------- */
const state = {
  room: "havuz", trust: 60, cards: new Set(), met: new Set(),
  cam: { x: 0, y: 0, follow: true }, hover: null, target: null,
  clockEnd: 0,
};
const room = () => ROOMS[state.room];

/* ---------- Canvas ---------- */
const stage = document.getElementById("stage");
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let cw = 0, ch = 0, dpr = 1, z = 1;
function resize() {
  const r = stage.getBoundingClientRect();
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  const tilePx = Math.max(48, Math.min(80, cw / 7));
  z = tilePx / TW;
}
new ResizeObserver(resize).observe(stage);
resize();

const iso = (x, y) => ({ x: (x - y) * TW / 2, y: (x + y) * TH / 2 });
function screenToWorld(px, py) {
  const bx = (px - cw / 2) / z + state.cam.x;
  const by = (py - ch / 2) / z + state.cam.y;
  return { bx, by, wx: (bx / (TW / 2) + by / (TH / 2)) / 2, wy: (by / (TH / 2) - bx / (TW / 2)) / 2 };
}

/* ---------- Yol bulma (Dijkstra, 8 yön, köşe kesmeden) ---------- */
function blockedSet(r) {
  const s = new Set();
  for (const n of npcs) if (n.room === r.id && !n.wander) s.add(Math.round(n.x) + "," + Math.round(n.y));
  return s;
}
function findPath(r, sx, sy, isGoal) {
  const W = r.w, H = r.h, N = W * H;
  const blocked = blockedSet(r);
  const walk = (x, y) => WALK.has(tileAt(r, x, y)) && !blocked.has(x + "," + y);
  const dist = new Float64Array(N).fill(Infinity), prev = new Int32Array(N).fill(-1), done = new Uint8Array(N);
  const s = sy * W + sx;
  if (s < 0 || s >= N) return null;
  dist[s] = 0;
  for (;;) {
    let u = -1, best = Infinity;
    for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0) return null;
    done[u] = 1;
    const ux = u % W, uy = (u / W) | 0;
    if (isGoal(ux, uy)) {
      const out = [];
      for (let v = u; v !== s; v = prev[v]) out.push([v % W, (v / W) | 0]);
      return out.reverse();
    }
    if (u !== s && !walk(ux, uy)) continue; // hedef karesi (şezlong vb.) geçiş yolu olamaz
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = ux + dx, ny = uy + dy;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (!walk(nx, ny) && !isGoal(nx, ny)) continue;
      if (dx && dy && (!walk(ux + dx, uy) || !walk(ux, uy + dy))) continue;
      const v = ny * W + nx, nd = dist[u] + (dx && dy ? 1.414 : 1);
      if (nd < dist[v]) { dist[v] = nd; prev[v] = u; }
    }
  }
}
function neighborsGoal(r, tx, ty) {
  const blocked = blockedSet(r);
  return (x, y) => Math.max(Math.abs(x - tx), Math.abs(y - ty)) === 1 && WALK.has(tileAt(r, x, y)) && !blocked.has(x + "," + y) && tileAt(r, x, y) !== "D";
}

/* ---------- Konuşma balonları ---------- */
function say(c, text, ms = 3200, o = {}) {
  c.bubble = { text, until: NOW + ms, secret: !!o.secret, key: !!o.key, convo: o.convo || null, idx: o.idx ?? -1, alert: !!o.alert };
}
function later(ms, fn) { setTimeout(fn, ms); }
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------- UI yardımcıları ---------- */
const $ = id => document.getElementById(id);
function toast(text, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind; el.textContent = text;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
  const all = $("toasts").children;
  if (all.length > 3) all[0].remove();
}
function setTrust(v) {
  state.trust = Math.max(0, Math.min(100, v));
  $("trust-val").textContent = state.trust;
  const f = $("trust-fill");
  f.style.width = state.trust + "%";
  f.style.backgroundColor = state.trust >= 50 ? "var(--deniz)" : state.trust >= 25 ? "var(--turunc)" : "var(--mercan)";
}
function unlockCard(id) {
  if (state.cards.has(id)) return;
  state.cards.add(id);
  const card = CARDS.find(c => c.id === id);
  $("cards-n").textContent = state.cards.size + "/" + CARDS.length;
  const b = $("cards-btn"); b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
  toast("Yeni sır kartı: " + card.title, "gold");
  if (state.cards.size === CARDS.length) later(1800, () => toast("İki sırrı da buldun. Yüzleşme Saati'nde kullanabilirsin.", "good"));
}
function playerInZone() {
  return state.room === "havuz" && tileAt(room(), Math.round(player.x), Math.round(player.y)) === "Z";
}

/* ---------- Oyuncu komutları ---------- */
function goTo(isGoal, action) {
  const r = room();
  const sx = Math.round(player.x), sy = Math.round(player.y);
  const p = findPath(r, sx, sy, isGoal);
  if (!p) { toast("Oraya yol yok."); return false; }
  player.sit = false;
  player.x = sx; player.y = sy;
  player.path = p; player.action = action || null;
  const end = p.length ? p[p.length - 1] : [sx, sy];
  state.target = { x: end[0], y: end[1], t: NOW };
  state.cam.follow = true;
  if (!p.length) arrive(player);
  return true;
}
function arrive(c) {
  if (!c.isPlayer) return;
  state.target = null;
  const a = c.action; c.action = null;
  if (!a) return;
  if (a.type === "sit") {
    c.x = a.x; c.y = a.y; c.sit = true;
    const r = room(), k = tileAt(r, a.x, a.y);
    if (k === "L") { const back = r.loungerBack[a.x + "," + a.y] || -1; setFace(c, 0, -back); }
    else {
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        if ("KN".includes(tileAt(r, a.x + dx, a.y + dy) || "")) { setFace(c, dx, dy); break; }
      }
    }
  } else if (a.type === "door") {
    changeRoom(a.door.to, a.door.at);
  } else if (a.type === "talk") {
    const n = a.npc;
    setFace(c, n.x - c.x, n.y - c.y);
    if (dist(c, n) > 1.9) return;
    if (SECRET.members.includes(n.id)) return; // yakalanma mantığı halleder
    say(c, "Selam!", 1600);
    later(650, () => {
      if (!n.def.talk) return;
      setFace(n, c.x - n.x, c.y - n.y);
      say(n, n.def.talk[n.talkI % n.def.talk.length], 3600);
      n.talkI++;
      if (!state.met.has(n.id)) { state.met.add(n.id); setTrust(state.trust + 4); toast(n.def.name + " ile tanıştın · Güven +4", "good"); }
    });
  } else if (a.type === "note") {
    setFace(c, a.x - c.x, a.y - c.y);
    unlockCard("not");
    const arda = byId.arda;
    if (arda.room === state.room) later(900, () => say(arda, "O not... Nereden buldun onu?", 3200));
  }
}
function changeRoom(to, at) {
  const f = $("fade");
  f.classList.add("on");
  setTimeout(() => {
    state.room = to;
    player.room = to; player.x = at[0]; player.y = at[1]; player.path = []; player.sit = false; player.bubble = null;
    state.target = null; state.hover = null; state.cam.follow = true;
    snapCamera();
    $("room-name").textContent = ROOMS[to].name;
    f.classList.remove("on");
    toast(ROOMS[to].name);
  }, 260);
}
function nearestTalker(maxD) {
  let best = null, bd = maxD;
  for (const n of npcs) {
    if (n.room !== state.room || SECRET.members.includes(n.id) || !n.def.greet) continue;
    const d = dist(n, player);
    if (d < bd) { bd = d; best = n; }
  }
  return best;
}
function playerSays(text) {
  const filtered = text.replace(/(\+?\d[\d\s-]{6,}\d)|(@[\w.]+)|\b(instagram|insta|whatsapp|telegram)\b/gi, "***");
  if (filtered !== text) toast("İletişim bilgisi paylaşımı engellendi.", "bad");
  say(player, filtered, 3600);
  const n = nearestTalker(3.3);
  if (!n) return;
  const greet = /\b(selam|merhaba|hey|naber|slm)\b/i.test(text);
  later(900, () => { setFace(n, player.x - n.x, player.y - n.y); say(n, pick(greet ? n.def.greet : n.def.replies), 3200); });
}

/* ---------- Dokunma / sürükleme ---------- */
let down = null;
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  down = { x: e.clientX, y: e.clientY, cx: state.cam.x, cy: state.cam.y, drag: false };
});
canvas.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  if (down) {
    const dx = e.clientX - down.x, dy = e.clientY - down.y;
    if (!down.drag && Math.hypot(dx, dy) > 8) down.drag = true;
    if (down.drag) { state.cam.follow = false; state.cam.x = down.cx - dx / z; state.cam.y = down.cy - dy / z; clampCamera(); }
  } else if (e.pointerType === "mouse") {
    const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
    const tx = Math.round(w.wx), ty = Math.round(w.wy);
    state.hover = tileAt(room(), tx, ty) ? { x: tx, y: ty } : null;
  }
});
canvas.addEventListener("pointerup", e => {
  if (!down) return;
  const wasDrag = down.drag; down = null;
  if (wasDrag) return;
  const rect = canvas.getBoundingClientRect();
  handleTap(e.clientX - rect.left, e.clientY - rect.top);
});
canvas.addEventListener("pointercancel", () => { down = null; });
canvas.addEventListener("pointerleave", () => { state.hover = null; });

function charHit(bx, by) {
  const list = npcs.filter(n => n.room === state.room).sort((a, b) => (b.x + b.y) - (a.x + a.y));
  for (const n of list) {
    const p = iso(n.x, n.y), top = n.sit ? 52 : 66;
    if (bx > p.x - 12 && bx < p.x + 12 && by > p.y - top && by < p.y + 4) return n;
  }
  return null;
}
function handleTap(px, py) {
  const r = room();
  const w = screenToWorld(px, py);
  const n = charHit(w.bx, w.by);
  if (n) {
    let tx = Math.round(n.x), ty = Math.round(n.y);
    if (n.wander) { n.pauseUntil = NOW + 4500; if (n.path.length) { n.path = n.path.slice(0, 1); [tx, ty] = n.path[0]; } }
    goTo(neighborsGoal(r, tx, ty), { type: "talk", npc: n });
    return;
  }
  const tx = Math.round(w.wx), ty = Math.round(w.wy);
  const k = tileAt(r, tx, ty);
  if (!k) return;
  const blocked = blockedSet(r);
  const free = !blocked.has(tx + "," + ty);
  if (WALK.has(k) && free) {
    const door = k === "D" ? r.doors[tx + "," + ty] : null;
    goTo((x, y) => x === tx && y === ty, door ? { type: "door", door } : null);
  } else if (SIT.has(k) && free) {
    goTo((x, y) => x === tx && y === ty, { type: "sit", x: tx, y: ty });
  } else if (k === "N" && !state.cards.has("not")) {
    goTo(neighborsGoal(r, tx, ty), { type: "note", x: tx, y: ty });
  } else {
    goTo(neighborsGoal(r, tx, ty), null);
  }
}

/* ---------- Butonlar ve pencereler ---------- */
$("chat").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("chat-input").value.trim();
  if (!v) return;
  playerSays(v);
  $("chat-input").value = "";
});
$("btn-wave").addEventListener("click", () => playerSays("Selam!"));
$("btn-cards").addEventListener("click", openCards);
$("cards-btn").addEventListener("click", openCards);
$("btn-map").addEventListener("click", openMap);
$("btn-help").addEventListener("click", openHelp);
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

function closeModal() { $("modal").hidden = true; }
function esc(s) { return s.replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[m])); }

  const rows = Object.values(ROOMS).map(r => `
    <button class="btn ${r.id === state.room ? "" : "ghost"} room-btn" type="button" data-room="${r.id}">
      ${esc(r.name)} <small>${r.id === state.room ? "Buradasın" : "Git"}</small>
    </button>`).join("");
  openModal(`

      <button class="btn ghost room-btn" type="button" disabled>İskele <small>Yakında</small></button>

    </div>`);

    closeModal();
    const to = b.dataset.room;
    if (to === state.room) return;
    const door = Object.values(ROOMS[state.room].doors).find(d => d.to === to);
    changeRoom(to, door.at);
  }));
}

/* ---------- Güncelleme ---------- */
function step(c, dt) {
  if (!c.path.length) { c.moving = false; return; }
  const [tx, ty] = c.path[0];
  const dx = tx - c.x, dy = ty - c.y, d = Math.hypot(dx, dy), sp = c.speed * dt;
  setFace(c, dx, dy);
  c.moving = true; c.walkT += dt * 11;
  if (d <= sp) {
    c.x = tx; c.y = ty; c.path.shift();
    if (!c.path.length) { c.moving = false; arrive(c); }
  } else { c.x += dx / d * sp; c.y += dy / d * sp; }
}
function wanderOK(r, x, y) {
  const k = tileAt(r, x, y);
  return k === "." && !(x >= 9 && y <= 5) && !(x === 8 && y <= 5);
}
function updateNPCs(dt) {
  for (const n of npcs) {
    step(n, dt);
    if (!n.wander) continue;
    const r = ROOMS[n.room];
    if (!n.path.length && NOW > n.nextWander && NOW > n.pauseUntil) {
      for (let tries = 0; tries < 20; tries++) {
        const x = Math.floor(Math.random() * r.w), y = Math.floor(Math.random() * r.h);
        if (!wanderOK(r, x, y) || dist({ x, y }, n) < 2) continue;
        const p = findPath(r, Math.round(n.x), Math.round(n.y), (a, b) => a === x && b === y);
        if (p) { n.path = p.filter(([a, b]) => wanderOK(r, a, b)).length === p.length ? p : []; break; }
      }
      n.nextWander = NOW + 3000 + Math.random() * 4000;
    }
    if (n.room === state.room && NOW > n.nextChat && dist(n, player) < 6 && !n.bubble) {
      say(n, pick(n.def.talk), 3400);
      n.nextChat = NOW + 10000 + Math.random() * 7000;
    }
  }
}
function updateConvos() {
  const inZone = playerInZone();
  if (state.room === "havuz") {
    const mem = SECRET.members.map(id => byId[id]);
    const near = mem.some(m => dist(m, player) < 2.6);
    if (near && !inZone) {
      if (!SECRET.caught) {
        SECRET.caught = true;
        say(byId.selin, "Bizi mi dinliyorsun?", 2800, { alert: true });
        later(1100, () => say(byId.kaan, "Bir şey mi lazımdı?", 2600, { alert: true }));
        setTrust(state.trust - 15);
        toast("Yakalandın! Güven -15", "bad");
        SECRET.i = 0; SECRET.next = NOW + 4000;
      }
    } else if (SECRET.caught && !mem.some(m => dist(m, player) < 3.6)) {
      SECRET.caught = false;
    }
    SECRET.blocked = SECRET.caught;
    if (inZone) for (const m of mem) {
      const b = m.bubble;
      if (b && b.key && b.convo === SECRET && NOW < b.until) SECRET.heard.add(b.idx);
    }
    if (SECRET.heard.size >= SECRET.keyCount) unlockCard("selin-kaan");
  } else {
    SECRET.caught = false; SECRET.blocked = false;
  }
  for (const cv of CONVOS) {
    if (cv.blocked || NOW < cv.next) continue;
    if (cv.i >= cv.lines.length) { cv.i = 0; cv.next = NOW + 6000; continue; }
    const [who, text, key] = cv.lines[cv.i];
    say(byId[who], text, 3000, { secret: cv.secret, key: !!key, convo: cv, idx: cv.i });
    cv.i++; cv.next = NOW + 3400;
  }
}
function clampCamera() {
  const r = room();
  const minX = iso(0, r.h - 1).x - TW, maxX = iso(r.w - 1, 0).x + TW;
  const minY = iso(0, 0).y - WALL_H - 30, maxY = iso(r.w - 1, r.h - 1).y + TH + 40;
  const vw = cw / z, vh = ch / z;
  const c = state.cam;
  c.x = (maxX - minX) <= vw ? (minX + maxX) / 2 : Math.max(minX + vw / 2, Math.min(maxX - vw / 2, c.x));
  c.y = (maxY - minY) <= vh ? (minY + maxY) / 2 : Math.max(minY + vh / 2, Math.min(maxY - vh / 2, c.y));
}
function snapCamera() { const p = iso(player.x, player.y); state.cam.x = p.x; state.cam.y = p.y - 20; clampCamera(); }
function updateCamera(dt) {
  if (!state.cam.follow) return;
  const p = iso(player.x, player.y);
  const k = 1 - Math.pow(0.002, dt);
  state.cam.x += (p.x - state.cam.x) * k;
  state.cam.y += (p.y - 20 - state.cam.y) * k;
  clampCamera();
}

/* ---------- Çizim yardımcıları ---------- */
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function diamond(cx, cy, s = 1) {
  return [[cx, cy - TH / 2 * s], [cx + TW / 2 * s, cy], [cx, cy + TH / 2 * s], [cx - TW / 2 * s, cy]];
}
function ellipse(x, y, rx, ry, fill) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); }
function rrect(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  if (f < 0) { r *= 1 + f; g *= 1 + f; b *= 1 + f; } else { r += (255 - r) * f; g += (255 - g) * f; b += (255 - b) * f; }
  return "rgb(" + (r | 0) + "," + (g | 0) + "," + (b | 0) + ")";
}
/* Dünya merkezli izometrik kutu: fx/fy taban oranı, h yükseklik, z0 zeminden kalkış */
function isoBox(wx, wy, fx, fy, h, z0, top, left, right) {
  const P = (dx, dy, up) => { const p = iso(wx + dx, wy + dy); return [p.x, p.y - up]; };
  const A = (u) => P(-fx / 2, -fy / 2, u), B = (u) => P(fx / 2, -fy / 2, u), Cc = (u) => P(fx / 2, fy / 2, u), D = (u) => P(-fx / 2, fy / 2, u);
  poly([D(z0), Cc(z0), Cc(z0 + h), D(z0 + h)], left);
  poly([Cc(z0), B(z0), B(z0 + h), Cc(z0 + h)], right);

/* ---------- Duvarlar ---------- */
function lerpP(a, b, u) { return { x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u }; }

function drawWallSeg(p1, p2, base, feat, lit) {

    poly(wq(p1, p2, 0.3, 0.5, 0.36, 0.72), lit ? "rgba(246,178,107,.55)" : "rgba(246,178,107,.3)");
    poly(wq(p1, p2, 0.24, 0.76, 0.27, 0.31), "#F7EFE2");
  } else if (feat === "door") {
    poly(wq(p1, p2, 0.16, 0.84, 0, 0.8), "#F7EFE2");
    poly(wq(p1, p2, 0.22, 0.78, 0, 0.74), "#7E4F33");
    poly(wq(p1, p2, 0.27, 0.48, 0.08, 0.66), "#6B412A");

    const h = lerpP(p1, p2, 0.7); circle(h.x, h.y - 0.36 * WALL_H, 1.6, "#F2C14E");
  }
  poly(wq(p1, p2, 0, 1, 0.95, 1.05), "#C46A3D");
  poly(wq(p1, p2, 0, 1, 1.05, 1.08), "#A9542F");
}
function drawWalls(r, t) {

  for (let x = 0; x < r.w; x++) {

function drawLights(r, t) {
  const runs = [[iso(-0.5, -0.5), iso(r.w - 0.5, -0.5), r.w], [iso(-0.5, -0.5), iso(-0.5, r.h - 0.5), r.h]];

}

/* ---------- Zemin ---------- */

function drawWater(r, x, y, p, t) {

  const T = [p.x, p.y - TH / 2], R = [p.x + TW / 2, p.y], B = [p.x, p.y + TH / 2], L = [p.x - TW / 2, p.y];

function drawRailing(r) {

  if (c.front) {
    hairFront(d);
    if (d.beard) { ctx.fillStyle = d.hair; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(0.8, -55.5, 6.2, 0.08 * Math.PI, 0.92 * Math.PI); ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1; }
    circle(1.2, -55.4, 0.95, "#2A1A14"); circle(4.2, -55.4, 0.95, "#2A1A14");
    if (d.blush) ellipse(4.8, -53.6, 1.3, 0.7, "rgba(230,110,90,.4)");
    ctx.strokeStyle = d.beard ? "#E9CFB8" : "#7A3F2E"; ctx.lineWidth = 0.9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(2.8, -53.4, 1.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  } else {
    hairBack(d);
  }
  ctx.restore();
}

/* ---------- Etiketler ve balonlar ---------- */
function wrap(text, maxW) {
  const words = text.split(" "), lines = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function drawLabels(chars) {
  const inZone = playerInZone();
  const placed = [];
  const viewL = state.cam.x - cw / (2 * z) + 6, viewR = state.cam.x + cw / (2 * z) - 6;
  for (const c of chars) {
    const p = iso(c.x, c.y), headTop = p.y - (c.sit ? 50 : 63) - (c.moving ? 1 : 0);
    ctx.font = "800 9px Manrope, system-ui, sans-serif";
    const nm = c.def.name, nw = ctx.measureText(nm).width + 10;
    rrect(p.x - nw / 2, headTop - 15, nw, 12, 6, c.isPlayer ? "#F28C28" : "rgba(17,28,46,.78)");
    ctx.fillStyle = c.isPlayer ? "#1B2A41" : "#F3E9DC"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(nm, p.x, headTop - 8.6);
    const b = c.bubble;
    if (!b || NOW > b.until) continue;
    const hidden = b.secret && !inZone;
    const text = hidden ? "• • •" : b.text;
    ctx.font = "700 11px Manrope, system-ui, sans-serif";
    const lines = wrap(text, 138);
    const lw = Math.max(...lines.map(l => ctx.measureText(l).width));
    const bw = lw + 16, bh = lines.length * 14 + 10;
    let bx = Math.max(viewL, Math.min(viewR - bw, p.x - bw / 2)), by = headTop - 20 - bh;
    // yan yana konuşanların balonları üst üste binmesin
    for (let guard = 0; guard < 6; guard++) {
      const hit = placed.find(q => bx < q.x + q.w && bx + bw > q.x && by < q.y + q.h && by + bh > q.y);
      if (!hit) break;
      by = hit.y - bh - 4;
    }
    placed.push({ x: bx, y: by, w: bw, h: bh });
    const tx = bx + bw / 2, tailX = Math.max(bx + 10, Math.min(bx + bw - 10, p.x));
    const fade = Math.min(1, (b.until - NOW) / 250);
    ctx.globalAlpha = fade;
    const fill = hidden ? "#D9D3C8" : b.secret ? "#FFF3D1" : "#FFFDF8";
    ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9);
    if (by + bh > headTop - 24) { ctx.moveTo(tailX - 5, by + bh); ctx.lineTo(tailX, by + bh + 6); ctx.lineTo(tailX + 5, by + bh); }
    ctx.fillStyle = fill; ctx.fill();
    if (b.alert) { ctx.strokeStyle = "#E4572E"; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9); ctx.stroke(); }
    if (b.secret && !hidden) { ctx.strokeStyle = "#F2C14E"; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 9); ctx.stroke(); }
    ctx.fillStyle = hidden ? "#6B7280" : "#1B2A41";
    lines.forEach((l, i) => ctx.fillText(l, tx, by + 12 + i * 14));
    ctx.globalAlpha = 1;
  }
}
function drawWorldTags(r, t) {
  ctx.font = "800 9px Manrope, system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const key in r.doors) {
    const [x, y] = key.split(",").map(Number), p = iso(x, y), label = r.doors[key].label + " ›";
    const w = ctx.measureText(label).width + 12, yy = p.y - 16 + Math.sin(t / 400) * 1.5;
    rrect(p.x - w / 2, yy - 7, w, 14, 7, "#F28C28");
    ctx.fillStyle = "#1B2A41"; ctx.fillText(label, p.x, yy);
  }
  if (r.id === "havuz" && dist(player, { x: 8, y: 2.5 }) > 3) {
    const p = iso(8, 2.5), yy = p.y - 12 + Math.sin(t / 450) * 1.5, label = "Saklanma köşesi";
    const w = ctx.measureText(label).width + 12;
    rrect(p.x - w / 2, yy - 7, w, 14, 7, "#F2C14E");
    ctx.fillStyle = "#1B2A41"; ctx.fillText(label, p.x, yy);
  }
}

/* ---------- Ana döngü ---------- */
function render(t) {
  const r = room();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawBackdrop(t);
  ctx.setTransform(dpr * z, 0, 0, dpr * z, dpr * (cw / 2 - state.cam.x * z), dpr * (ch / 2 - state.cam.y * z));
  drawWalls(r, t);
  drawPlatformSides(r);
  drawFloor(r, t);
  drawOverlays(r, t);
  const chars = npcs.filter(n => n.room === state.room).concat(player);
  const items = r.objects.map(o => ({ d: o.x + o.y, f: () => drawObject(r, o, t) }))
    .concat(chars.map(c => ({ d: c.x + c.y + 0.05 + (c.sit ? 0.05 : 0), f: () => drawChar(c) })));
  items.sort((a, b) => a.d - b.d);
  for (const it of items) it.f();
  drawRailing(r);
  drawWorldTags(r, t);
  drawLabels(chars.sort((a, b) => (a.x + a.y) - (b.x + b.y)));
}

let last = 0, clockTick = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; NOW = ts;
  step(player, dt);
  updateNPCs(dt);
  updateConvos();
  updateCamera(dt);
  $("hide-chip").hidden = !playerInZone();
  if (ts - clockTick > 250) {
    clockTick = ts;
    const s = Math.max(0, Math.floor((state.clockEnd - Date.now()) / 1000));
    const hh = String(Math.floor(s / 3600)).padStart(2, "0"), mm = String(Math.floor(s / 60) % 60).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
    $("clock").textContent = hh + ":" + mm + ":" + ss;
  }
  render(ts);
  requestAnimationFrame(frame);
}

function start(data) {
  data = data || {};
  state.clockEnd = data.clockEnd || (Date.now() + (2 * 3600 + 14 * 60 + 37) * 1000);
  if (data.room && ROOMS[data.room]) {
    state.room = data.room; player.room = data.room;
    player.x = data.x ?? player.x; player.y = data.y ?? player.y;
    $("room-name").textContent = ROOMS[data.room].name;
  }
  (data.cards || []).forEach(id => state.cards.add(id));
  (data.met || []).forEach(id => state.met.add(id));
  $("cards-n").textContent = state.cards.size + "/" + CARDS.length;
  setTrust(data.trust ?? state.trust);
  window.claude?.hot?.snapshot?.(() => ({
    room: state.room, x: Math.round(player.x), y: Math.round(player.y),
    cards: [...state.cards], met: [...state.met], trust: state.trust, clockEnd: state.clockEnd,
  }));
  snapCamera();
  let seen = false;
  try { seen = localStorage.getItem("villa-intro") === "1"; } catch (_) {}
  if (!seen && !data.room) openHelp(true);
  requestAnimationFrame(frame);
}
/* Otomatik testler için: kareyi ekran koordinatına çevirir, durumu okur */
window.__villa = {
  tileToScreen(x, y, up = 0) { const p = iso(x, y); return { x: (p.x - state.cam.x) * z + cw / 2, y: (p.y - up - state.cam.y) * z + ch / 2 }; },
  info() { return { room: state.room, x: player.x, y: player.y, sit: player.sit, trust: state.trust, cards: [...state.cards], zone: playerInZone() }; },
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
